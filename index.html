<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO-AJEDREZ-Z</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div id="petals-container"></div>

    <div class="game-container">

        <!-- ===== MENÚ ===== -->
        <div id="menu-screen" class="screen">
            <h1>棋 AJEDREZ-Z</h1>
            <p class="subtitle">· configura tu batalla ·</p>

            <div class="form-group">
                <label for="game-mode">Modo de Juego</label>
                <select id="game-mode">
                    <option value="pvp">Jugador vs Jugador</option>
                    <option value="bot">Jugador vs IA</option>
                </select>
            </div>

            <div id="bot-difficulty-group" class="form-group hidden">
                <label for="bot-difficulty">Dificultad</label>
                <select id="bot-difficulty">
                    <option value="easy">Fácil — Aleatorio</option>
                    <option value="medium">Normal — Codicioso</option>
                    <option value="hard">Difícil — Minimax</option>
                </select>
            </div>

            <div class="form-group">
                <label for="player-color">Jugar como</label>
                <select id="player-color">
                    <option value="white">⬜ Blancas</option>
                    <option value="black">⬛ Negras</option>
                </select>
            </div>

            <button id="btn-start" class="btn">Iniciar Partida</button>
            <button id="btn-mute" class="btn btn-secondary" style="margin-top:10px">🔊 Sonido</button>
        </div>

        <!-- ===== JUEGO ===== -->
        <div id="game-screen" class="screen hidden">
            <div class="game-layout">

                <div class="control-panel">
                    <h2>棋 Partida</h2>
                    <div class="status-box">
                        <small>Turno actual</small>
                        <span id="current-turn">⬜ Blancas</span>
                    </div>
                    <div class="actions">
                        <button id="btn-undo"    class="btn btn-secondary">↩ Deshacer</button>
                        <button id="btn-restart" class="btn btn-danger">✕ Abandonar</button>
                    </div>
                    <div class="panel-deco">❀ ❀ ❀</div>
                </div>

                <!-- Tablero con borde superior visible -->
                <div class="board-wrapper">
                    <div class="board-top-bar">❀ &nbsp; ✦ &nbsp; ❀</div>
                    <div id="chess-board" class="board"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/logic.js"></script>
    <script src="assets/js/bot.js"></script>
    <script src="assets/js/audio.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>

    <script>
        // Pétalos de fondo
        const pc = document.getElementById('petals-container');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.classList.add('petal');
            p.textContent = ['🌸','✿','❀','✦'][Math.floor(Math.random()*4)];
            p.style.left = Math.random()*100 + 'vw';
            p.style.fontSize = (10+Math.random()*12) + 'px';
            p.style.animationDuration = (12+Math.random()*20) + 's';
            p.style.animationDelay = -(Math.random()*20) + 's';
            pc.appendChild(p);
        }
    </script>
</body>
</html>

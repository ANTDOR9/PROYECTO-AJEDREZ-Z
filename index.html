<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO-AJEDREZ-Z</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- ================================================
         PANTALLA 1: MENÚ CON EFECTO VELA
    ================================================ -->
    <div id="menu-screen">

        <!-- Fondo: dragones y nubes estilo tinta china -->
        <div id="menu-bg"></div>

        <!-- Overlay negro con máscara circular (la "oscuridad") -->
        <div id="candle-overlay"></div>

        <!-- Cursor vela personalizado -->
        <div id="custom-cursor">
            <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24">
                <path fill="#f9aa47" d="M6 20h12q.425 0 .713-.288T19 19H5q0 .425.288.713T6 20m6-12q-1.2 0-2-.837t-.75-2.038q.05-1.3.913-2.287T12 1q.975.85 1.838 1.838t.912 2.287q.05 1.2-.75 2.038T12 8m-1 9h2v-6h-2zm1-11q.325 0 .538-.225t.212-.55q0-.425-.238-.775T12 3.775q-.275.325-.513.675t-.237.775q0 .325.213.55T12 6m8.25 11q.325 0 .538-.213T21 16.25t-.213-.537t-.537-.213t-.537.213t-.213.537t.213.538t.537.212M18 22H6q-1.25 0-2.125-.875T3 19v-2h6V9h6v8h2.6q-.05-.2-.075-.375t-.025-.375q0-1.15.8-1.95t1.95-.8t1.95.8t.8 1.95q0 .95-.562 1.675T21 18.9v.1q0 1.25-.875 2.125T18 22m-7-5h2zm1-12.1"/>
            </svg>
            <!-- Halo de luz alrededor del cursor -->
            <div id="cursor-glow"></div>
        </div>

        <!-- Pétalos flotantes (siempre visibles encima del overlay) -->
        <div id="petals-container"></div>

        <!-- Contenido del menú (encima de todo) -->
        <div id="menu-content">

            <!-- Logo del juego -->
            <div id="menu-logo">
                <!-- Si tienes el PNG listo, reemplaza esto: -->
                <img src="assets/images/menu/logo.png" alt="PROYECTO-AJEDREZ-Z"
                     onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'">
                <h1 id="logo-fallback" style="display:none">棋 AJEDREZ-Z</h1>
            </div>

            <!-- Formularios de configuración -->
            <div class="menu-form">
                <div class="form-group">
                    <label for="game-mode">Modo de Juego</label>
                    <select id="game-mode">
                        <option value="pvp">Jugador vs Jugador</option>
                        <option value="bot">Jugador vs IA</option>
                    </select>
                </div>

                <div id="bot-difficulty-group" class="form-group hidden">
                    <label for="bot-difficulty">Dificultad</label>
                    <select id="bot-difficulty">
                        <option value="easy">Fácil — Aleatorio</option>
                        <option value="medium">Normal — Codicioso</option>
                        <option value="hard">Difícil — Minimax</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="player-color">Jugar como</label>
                    <select id="player-color">
                        <option value="white">⬜ Blancas</option>
                        <option value="black">⬛ Negras</option>
                    </select>
                </div>
            </div>

            <!-- Botones con GIF de fondo -->
            <div class="menu-buttons">
                <button id="btn-start" class="btn-gif">
                    <img src="assets/images/menu/btn_iniciar.gif" class="btn-gif-bg"
                         onerror="this.style.display='none'">
                    <span>Iniciar Partida</span>
                </button>

                <button id="btn-mute" class="btn-gif btn-gif--sm">
                    <img src="assets/images/menu/btn_modo.gif" class="btn-gif-bg"
                         onerror="this.style.display='none'">
                    <span>🔊 Sonido</span>
                </button>
            </div>

        </div>
    </div>

    <!-- ================================================
         PANTALLA 2: ZONA DE JUEGO
    ================================================ -->
    <div id="game-screen" class="hidden">
        <div class="game-layout">

            <div class="control-panel">
                <h2>棋 Partida</h2>
                <div class="status-box">
                    <small>Turno actual</small>
                    <span id="current-turn">⬜ Blancas</span>
                </div>
                <div class="actions">
                    <button id="btn-undo"    class="btn btn-secondary">↩ Deshacer</button>
                    <button id="btn-restart" class="btn btn-danger">✕ Abandonar</button>
                </div>
                <div class="panel-deco">❀ ❀ ❀</div>
            </div>

            <div class="board-wrapper">
                <div class="board-top-bar">❀ &nbsp; ✦ &nbsp; ❀</div>
                <div id="chess-board" class="board"></div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/logic.js"></script>
    <script src="assets/js/bot.js"></script>
    <script src="assets/js/audio.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/menu.js"></script>
</body>
</html>
